<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - DebugMe</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>

<body>

    <!-- NAVBAR -->

    <div class="nav">

        <div class="logo">
            <img src="/assets/DMLogo.png" alt="Logo" width="200">
        </div>

        <ul>
            <li><a href="/index">Home</a></li>
            <li><a href="/search">Search Errors</a></li>
            <li><a href="/add-error">Add Error</a></li>
        </ul>

        <div class="btns">
            <button class="login" onclick="location.href='/login'">
                Login
            </button>

            <button class="register" onclick="location.href='/register'">
                Register
            </button>
        </div>

    </div>


    <!-- LOGIN PAGE -->

    <section class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <span class="auth-badge">
                    👋 Welcome Back
                </span>

                <h1>Login</h1>

                <p>
                    Login to continue your journey with DebugMe.
                </p>

            </div>


            <form id="loginForm">

                <div class="auth-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot-password">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <div class="guest-login">

                <button onclick="location.href='/index'">
                    Continue as Guest
                </button>

            </div>


            <p class="auth-bottom">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            &lt;/&gt; DebugMe
        </div>

        <nav>
            <a href="/index">Home</a>
            <a href="/search">Search Errors</a>
            <a href="/add-error">Add Error</a>
        </nav>

        <div class="copy">
            © 2025 DebugMe. Built for students, by Pradyumna & Khushal.
        </div>

        <div class="social">
            <i class="fab fa-github"></i>
            <i class="fab fa-discord"></i>
            <i class="fab fa-youtube"></i>
            <i class="fab fa-linkedin"></i>
        </div>

    </footer>


    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            alert("Login will be connected to the backend.");

        });

    </script>

</body>

</html>
